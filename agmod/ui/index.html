<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>AI Mod Builder · 游戏 Mod 智能工作台 · 制作新 Mod</title>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('aimod_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <style>
    :root, [data-theme="dark"] {
      --bg-root: #08090e;
      --bg-ambient: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 65%), #08090e;
      --bg-nav: rgba(11, 13, 20, 0.82);
      --bg-card: #12141e;
      --bg-card-hover: #171b28;
      --bg-card-inner: #0b0d14;
      --bg-input: #0a0b12;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --border-focus: #6366f1;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --primary-ink: #ffffff;
      --emerald: #10b981;
      --emerald-bg: rgba(16, 185, 129, 0.12);
      --emerald-glow: rgba(16, 185, 129, 0.4);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --rose: #f43f5e;
      --rose-bg: rgba(244, 63, 94, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --code-bg: #05060a;
      --code-text: #e2e8f0;
      --chat-assistant-bg: #12141f;
      --chat-user-bg: #1e2236;
      --chat-user-border: rgba(99, 102, 241, 0.3);
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 20px;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "JetBrains Mono", monospace;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
    }

    [data-theme="light"] {
      --bg-root: #f8fafc;
      --bg-ambient: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 60%), #f8fafc;
      --bg-nav: rgba(255, 255, 255, 0.88);
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-card-inner: #f8fafc;
      --bg-input: #ffffff;
      --border: rgba(15, 23, 42, 0.08);
      --border-hover: rgba(15, 23, 42, 0.18);
      --border-focus: #4f46e5;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-glow: rgba(79, 70, 229, 0.25);
      --primary-ink: #ffffff;
      --emerald: #059669;
      --emerald-bg: rgba(16, 185, 129, 0.1);
      --emerald-glow: rgba(16, 185, 129, 0.3);
      --amber: #d97706;
      --amber-bg: rgba(217, 119, 6, 0.1);
      --rose: #e11d48;
      --rose-bg: rgba(225, 29, 72, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --chat-assistant-bg: #ffffff;
      --chat-user-bg: #eef2ff;
      --chat-user-border: rgba(79, 70, 229, 0.2);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
      --shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 24px 48px -12px rgba(15, 23, 42, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg-ambient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Top Navigation */
    header.top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 68px;
      backdrop-filter: blur(16px);
      background: var(--bg-nav);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.02em;
      cursor: pointer;
      user-select: none;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      background: var(--emerald-bg);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }

    /* Guided Workflow Stepper in Header */
    .workflow-stepper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 5px 8px;
      border-radius: 30px;
      box-shadow: var(--shadow-sm);
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 0;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }
    .step-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    .step-item.active {
      background: var(--primary);
      color: var(--primary-ink);
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .step-item.active .step-num {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .step-item.completed {
      color: var(--emerald);
    }
    .step-item.completed .step-num {
      background: var(--emerald);
      color: #fff;
    }
    .step-arrow {
      color: var(--border-hover);
      font-size: 10px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 15px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      transition: all 0.15s ease;
      white-space: nowrap;
      user-select: none;
    }
    button.btn:hover:not(:disabled),
    button.btn:focus-visible {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }
    button.btn:focus-visible,
    .step-item:focus-visible,
    .brand:focus-visible,
    .pill-btn:focus-visible,
    .sidebar-tab-btn:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 3px;
    }
    button.btn:disabled,
    button.btn[aria-disabled="true"] {
      cursor: not-allowed;
      opacity: 0.58;
      filter: saturate(0.72);
      transform: none;
    }
    button.btn:hover:disabled,
    button.btn:hover[aria-disabled="true"] {
      background: var(--bg-card);
      border-color: var(--border);
      transform: none;
    }
    button.btn:active {
      transform: translateY(0);
    }
    button.btn-primary {
      background: var(--primary) !important;
      color: var(--primary-ink) !important;
      border-color: var(--primary) !important;
      box-shadow: 0 2px 10px var(--primary-glow);
    }
    button.btn-primary:hover:not(:disabled),
    button.btn-primary:focus-visible {
      background: var(--primary-hover) !important;
      border-color: var(--primary-hover) !important;
      color: var(--primary-ink) !important;
      transform: translateY(-1px);
    }
    button.btn-launch {
      background: linear-gradient(135deg, #059669, #10b981) !important;
      color: #ffffff !important;
      border: 1px solid #10b981 !important;
      box-shadow: 0 4px 16px var(--emerald-glow);
    }
    button.btn-launch:hover:not(:disabled),
    button.btn-launch:focus-visible {
      background: linear-gradient(135deg, #047857, #059669) !important;
      color: #ffffff !important;
      border-color: #059669 !important;
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.65) !important;
      transform: translateY(-1px);
    }
    button.btn-launch:active {
      transform: translateY(0);
    }
    button.btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* Pulse dot */
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Main Container */
    main.app-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1560px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px;
      height: calc(100vh - 68px);
    }

    /* ========================================================
       STAGE 1: Game Library View
       ======================================================== */
    #stage-library {
      display: flex;
      flex-direction: column;
      gap: 24px;
      height: 100%;
    }
    .library-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 20px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .library-title h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .library-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .library-search {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .library-search input {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      width: 260px;
      outline: none;
    }
    .library-search input:focus {
      border-color: var(--border-focus);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 22px;
      overflow-y: auto;
      padding-bottom: 30px;
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    .game-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: var(--shadow);
      border-color: rgba(99, 102, 241, 0.4);
    }
    .game-card-cover {
      width: 100%;
      height: 140px;
      background: var(--bg-card-inner);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .game-card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .game-card:hover .game-card-cover img {
      transform: scale(1.05);
    }
    .game-card-cover .cover-placeholder {
      font-size: 40px;
      opacity: 0.4;
    }
    .game-card-status {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(10, 12, 18, 0.75);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .game-card-status.running {
      background: rgba(16, 185, 129, 0.9);
      border-color: #10b981;
      box-shadow: 0 0 10px var(--emerald-glow);
    }
    .game-card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .game-card-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
    }
    .game-card-engine {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
      align-self: flex-start;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }
    .game-card-actions {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ========================================================
       STAGE 2: Gatekeeper Card (Launch & Attach Game)
       ======================================================== */
    #stage-gatekeeper {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
    }
    #stage-gatekeeper.active {
      display: flex;
    }

    .gatekeeper-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      max-width: 680px;
      width: 100%;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      animation: fadeInScale 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    .gatekeeper-cover {
      width: 100%;
      height: 180px;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    .gatekeeper-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65) blur(1px);
    }
    .gatekeeper-overlay-info {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
      background: linear-gradient(to top, rgba(18, 20, 30, 0.98), transparent);
    }
    .gatekeeper-overlay-info h2 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .gatekeeper-overlay-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .gatekeeper-body {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .gatekeeper-step-desc {
      background: var(--bg-card-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .gatekeeper-step-icon {
      font-size: 24px;
    }
    .gatekeeper-step-text h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }
    .gatekeeper-step-text p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .gatekeeper-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .gatekeeper-status-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ========================================================
       STAGE 3 & 4: AI Mod Studio (Split Workspace)
       ======================================================== */
    #stage-studio {
      display: none;
      height: 100%;
      gap: 22px;
    }
    #stage-studio.active {
      display: flex;
    }

    /* Left: AI Mod Copilot */
    .studio-chat {
      flex: 1.8;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .chat-header {
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card-inner);
    }
    .chat-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header-info h2 {
      font-size: 16px;
      font-weight: 700;
    }
    .chat-running-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--emerald);
      background: var(--emerald-bg);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 3px 9px;
      border-radius: 12px;
    }

    /* Inspiration Pills */
    .chat-pills-bar {
      padding: 10px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      background: var(--bg-card);
    }
    .chat-pills-bar span.label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .pill-btn {
      font-size: 12px;
      padding: 4px 11px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card-inner);
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .pill-btn:hover:not(:disabled),
    .pill-btn:focus-visible {
      background: var(--primary);
      color: var(--primary-ink);
      border-color: var(--primary);
    }

    /* Chat Stream */
    .chat-messages {
      flex: 1;
      padding: 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 86%;
    }
    .msg-user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 0 10px var(--primary-glow);
    }
    .msg-user .msg-avatar {
      background: var(--text-muted);
      box-shadow: none;
    }
    .msg-content {
      background: var(--chat-assistant-bg);
      border: 1px solid var(--border);
      padding: 15px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
    }
    .msg-user .msg-content {
      background: var(--chat-user-bg);
      border-color: var(--chat-user-border);
    }

    /* REA Reverse-Engineering Insight Card */
    .rea-card {
      margin-top: 12px;
      background: rgba(99, 102, 241, 0.05);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rea-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(99, 102, 241, 0.12);
      padding-bottom: 6px;
    }
    .rea-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(99, 102, 241, 0.12);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
    }
    .rea-card-body {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      line-height: 1.5;
    }
    .rea-item {
      display: flex;
      gap: 8px;
    }
    .rea-label {
      color: var(--text-dim);
      flex-shrink: 0;
      font-weight: 600;
    }
    .rea-val {
      color: var(--text-main);
      word-break: break-all;
    }

    /* HUD Action Card inside AI Message */
    .action-card {
      margin-top: 14px;
      background: var(--bg-card-inner);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius-sm);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.08);
    }
    .action-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
    }
    .tuning-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .tuning-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 13px;
    }
    .tuning-item input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
    }
    .action-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    /* Bottom Chat Bar */
    .chat-input-bar {
      padding: 16px 22px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      display: flex;
      gap: 12px;
    }
    .chat-input-bar textarea {
      flex: 1;
      resize: none;
      height: 48px;
      padding: 12px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      line-height: 1.4;
    }
    .chat-input-bar textarea:focus {
      border-color: var(--border-focus);
    }

    /* Right: Live Tuning & Mod Shelf */
    .studio-sidebar {
      flex: 1.2;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card-inner);
    }
    .sidebar-tab-btn {
      flex: 1;
      padding: 13px 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .sidebar-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--bg-card);
    }
    .sidebar-tab-btn:hover,
    .sidebar-tab-btn:focus-visible {
      color: var(--text-main);
      background: var(--bg-card-hover);
    }
    .sidebar-content {
      flex: 1;
      padding: 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mod-item-card {
      background: var(--bg-card-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mod-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 13px;
    }

    /* Modal Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 540px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 {
      font-size: 17px;
      font-weight: 700;
    }
    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-group input, .form-group select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--border-focus);
    }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-card-inner);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.2s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="top-nav">
    <button class="brand" type="button" onclick="goToStage(1)" aria-label="返回游戏选择">
      <div class="brand-icon">⚡</div>
      <span>AI Mod Builder</span>
      <span class="brand-badge">PRO</span>
    </button>

    <!-- 4-Step Guided Workflow Stepper -->
    <div class="workflow-stepper">
      <button class="step-item active" id="step-btn-1" type="button" onclick="goToStage(1)">
        <span class="step-num">1</span>
        <span>挑选游戏</span>
      </button>
      <span class="step-arrow">➔</span>
      <button class="step-item" id="step-btn-2" type="button" onclick="goToStage(2)">
        <span class="step-num">2</span>
        <span>启动与连接</span>
      </button>
      <span class="step-arrow">➔</span>
      <button class="step-item" id="step-btn-3" type="button" onclick="goToStage(3)">
        <span class="step-num">3</span>
        <span>AI 创作与调优</span>
      </button>
      <span class="step-arrow">➔</span>
      <button class="step-item" id="step-btn-4" type="button" onclick="goToStage(4)">
        <span class="step-num">4</span>
        <span>固化 Mod</span>
      </button>
    </div>

    <div class="nav-actions">
      <button class="btn btn-sm" onclick="scanGames()">🔍 扫描游戏</button>
      <button class="btn btn-sm" id="btn-save-backup" onclick="createSaveBackup()">🛡️ 备份存档</button>
      <button class="btn btn-sm" onclick="openLLMModal()">⚙️ 模型配置 (CC Switch)</button>
      <button class="btn btn-sm" onclick="toggleTheme()" title="切换亮/暗模式" id="theme-btn">🌙</button>
    </div>
  </header>

  <!-- App Shell -->
  <main class="app-shell">

    <!-- ==========================================
         STAGE 1: Steam Game Library
         ========================================== -->
    <section id="stage-library">
      <div class="library-header">
        <div class="library-title">
          <h1>本地 Steam 游戏大厅 · 制作新 Mod</h1>
          <p>第 1 步：请选择你要进行 Mod 制作的游戏。点击卡片将进入专属引导流程。</p>
        </div>
        <div class="library-search">
          <input type="text" id="game-search-input" placeholder="搜索游戏名称或引擎..." oninput="filterGames()">
          <button class="btn btn-sm" onclick="addCustomGame()">➕ 手动路径</button>
        </div>
      </div>

      <div class="games-grid" id="games-grid">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- ==========================================
         STAGE 2: Gatekeeper (Launch & Attach Game)
         ========================================== -->
    <section id="stage-gatekeeper">
      <div class="gatekeeper-card">
        <div class="gatekeeper-cover" id="gatekeeper-cover-box">
          <img src="" id="gatekeeper-cover-img" alt="Cover">
          <div class="gatekeeper-overlay-info">
            <h2 id="gatekeeper-game-title">游戏名称</h2>
            <p id="gatekeeper-game-meta">引擎: Unity Mono · 适配器已就绪</p>
          </div>
        </div>
        <div class="gatekeeper-body">
          <div class="gatekeeper-step-desc">
            <div class="gatekeeper-step-icon">🔒</div>
            <div class="gatekeeper-step-text">
              <h4>必须先启动游戏，AI 才能进行实时修改</h4>
              <p>为了让 AI 写的每一个 Mod 能够<strong>在游戏画面里立刻生效</strong>，我们需要建立与游戏运行进程（PID）的双向热挂钩通道。请点击下方按钮启动游戏。</p>
            </div>
          </div>

          <div class="gatekeeper-actions">
            <button class="btn btn-launch" style="padding: 12px 32px; font-size: 15px;" onclick="launchAndAdvance()">
              ▶ 一键启动游戏并建立 AI 连接
            </button>
            <div class="gatekeeper-status-banner">
              <span class="pulse-dot" id="gatekeeper-pulse"></span>
              <span id="gatekeeper-status-text">正在监测游戏进程启动中...</span>
            </div>
            <div style="display:flex; gap:16px; margin-top:8px;">
              <a href="javascript:void(0)" onclick="manualProcessRefresh()" style="font-size:12px; color:var(--primary); text-decoration:none;">手动刷新连接状态 ↻</a>
              <a href="javascript:void(0)" onclick="skipLaunchToStudio()" style="font-size:12px; color:var(--text-dim); text-decoration:none;">暂不启动，直接编写离线 Mod ➔</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ==========================================
         STAGE 3 & 4: AI Mod Studio (Split Workspace)
         ========================================== -->
    <section id="stage-studio">
      
      <!-- Left Column: AI Mod Copilot -->
      <div class="studio-chat">
        <div class="chat-header">
          <div class="chat-header-info">
            <h2 id="studio-game-title">游戏名称</h2>
            <div class="chat-running-pill" id="studio-running-pill">
              <span class="pulse-dot"></span>
              <span id="studio-pid-text">实时通道已连接</span>
            </div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-sm" onclick="goToStage(1)">← 更换游戏</button>
            <button class="btn btn-sm btn-launch" id="studio-launch-btn" onclick="launchCurrentGame()">▶ 启动游戏</button>
          </div>
        </div>

        <!-- Inspiration Pills -->
        <div class="chat-pills-bar">
          <span class="label">快捷灵感:</span>
          <button class="pill-btn" onclick="sendPrompt('角色移动速度提升 100%')">⚡ 移速翻倍</button>
          <button class="pill-btn" onclick="sendPrompt('解锁空中二段跳')">🦘 空中二段跳</button>
          <button class="pill-btn" onclick="sendPrompt('金币掉落倍率提高 5 倍')">💰 5倍金币</button>
          <button class="pill-btn" onclick="sendPrompt('受到伤害减免 100% 无敌护盾')">🛡️ 无敌金身</button>
          <button class="pill-btn" onclick="sendPrompt('攻击距离与挥砍范围翻倍')">🗡️ 剑气范围扩大</button>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chat-messages">
          <!-- Dynamically inserted -->
        </div>

        <!-- Bottom Chat Input -->
        <div class="chat-input-bar">
          <textarea id="prompt-input" placeholder="对 AI 说出你想要的 Mod 功能... (例如：攻击时附带剑气、无限制跳跃、敌人血量减半)" onkeydown="handleChatKey(event)"></textarea>
          <button class="btn btn-primary" id="btn-send" onclick="submitPrompt()">发送生成</button>
        </div>
      </div>

      <!-- Right Column: Live Tuning & Mod Shelf -->
      <div class="studio-sidebar">
        <div class="sidebar-tabs">
          <button class="sidebar-tab-btn active" id="tab-live" onclick="switchSidebarTab('live')">实时生效中 (<span id="active-mods-count">0</span>)</button>
          <button class="sidebar-tab-btn" id="tab-mods" onclick="switchSidebarTab('mods')">已固化 Mod (<span id="installed-mods-count">0</span>)</button>
          <button class="sidebar-tab-btn" id="tab-saves" onclick="switchSidebarTab('saves')">安全存档</button>
        </div>

        <div class="sidebar-content" id="sidebar-content">
          <!-- Dynamically rendered -->
        </div>
      </div>

    </section>

  </main>

  <!-- LLM & CC Switch Settings Modal -->
  <div class="modal-overlay" id="llm-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>大模型配置 (CC Switch / OpenAI 格式)</h3>
        <button class="btn btn-sm" onclick="closeLLMModal()">✕</button>
      </div>
      <form class="modal-body" id="llm-config-form" onsubmit="return false;">
        <div class="form-group">
          <label>快速预设配置</label>
          <select id="llm-preset-select" onchange="onPresetChange()">
            <option value="ccswitch" selected>CC Switch (本地网关/中转)</option>
            <option value="deepseek">DeepSeek 官方 API</option>
            <option value="openai">OpenAI (GPT-4o)</option>
            <option value="ollama">Ollama (本地免联网)</option>
            <option value="qwen">通义千问 (DashScope)</option>
            <option value="siliconflow">硅基流动 (SiliconFlow)</option>
          </select>
        </div>
        <div class="form-group">
          <label>API 端点 (Base URL)</label>
          <input type="text" id="llm-endpoint" placeholder="http://127.0.0.1:8000/v1">
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="llm-key" autocomplete="off" placeholder="在此输入 API Key (如使用 CC Switch 或本地代理可留空或填默认key)">
        </div>
        <div class="form-group">
          <label>模型名称 (Model Name)</label>
          <input type="text" id="llm-model" placeholder="claude-3-7-sonnet">
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn btn-sm" onclick="testLLMConnection()">⚡ 测试连接</button>
        <button class="btn btn-sm btn-primary" onclick="saveLLMConfig()">💾 保存配置</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    // State
    let currentStage = 1; // 1: Library, 2: Gatekeeper, 3: Studio, 4: Pinned
    let allGames = [];
    let currentGame = null;
    let activeActions = [];
    let installedMods = [];
    let chatHistory = [];
    let currentSidebarTab = 'live';
    let processPollTimer = null;

    // Initialization
    window.addEventListener('DOMContentLoaded', async () => {
      await loadLLMConfig();
      await scanGames();
    });

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = (type === 'success' ? '✅ ' : type === 'error' ? '❌ ' : 'ℹ️ ') + String(msg ?? '');
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const target = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('aimod_theme', target);
      document.getElementById('theme-btn').textContent = target === 'dark' ? '🌙' : '☀️';
    }

    // --- Guided Stage Management ---
    function goToStage(stage) {
      if (stage > 1 && !currentGame) {
        showToast('请先选择一个游戏', 'error');
        return;
      }
      currentStage = stage;

      // Update Top Stepper Pills
      for (let i = 1; i <= 4; i++) {
        const btn = document.getElementById('step-btn-' + i);
        if (btn) {
          btn.className = 'step-item';
          if (i === stage) {
            btn.classList.add('active');
          } else if (i < stage) {
            btn.classList.add('completed');
          }
        }
      }

      // Hide all stage sections
      document.getElementById('stage-library').style.display = 'none';
      document.getElementById('stage-gatekeeper').classList.remove('active');
      document.getElementById('stage-studio').classList.remove('active');

      if (stage === 1) {
        document.getElementById('stage-library').style.display = 'flex';
      } else if (stage === 2) {
        setupGatekeeper(currentGame);
      } else if (stage >= 3) {
        setupStudio(currentGame);
      }
    }

    // --- Stage 1: Games Discovery & Selection ---
    async function scanGames() {
      try {
        const resp = await fetch('/api/games/scan');
        const json = await resp.json();
        if (json.success) {
          allGames = json.data || [];
          renderGameCards(allGames);
        }
      } catch (e) {
        showToast('扫描游戏失败: ' + e.message, 'error');
      }
    }

    function renderGameCards(games) {
      const grid = document.getElementById('games-grid');
      grid.innerHTML = '';
      if (games.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; padding: 60px 20px; color: var(--text-muted);">
            <h3>暂未扫描到默认 Steam 游戏</h3>
            <p style="margin-top:8px;">请确保 Steam 已安装，或点击右上角「➕ 手动路径」添加游戏目录。</p>
          </div>
        `;
        return;
      }

      games.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.setAttribute('role', 'button');
        card.tabIndex = 0;
        card.onclick = () => selectGameAndAdvance(g);
        card.onkeydown = (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selectGameAndAdvance(g);
          }
        };

        const coverHtml = g.cover_url
          ? `<img src="${g.cover_url}" alt="${g.name}" onerror="this.parentElement.innerHTML='<div class=\\'cover-placeholder\\'>🎮</div>'">`
          : `<div class="cover-placeholder">🎮</div>`;

        const statusHtml = g.is_running
          ? `<div class="game-card-status running"><span class="pulse-dot"></span> 运行中 (PID: ${g.running_pid})</div>`
          : `<div class="game-card-status">● 未运行</div>`;

        card.innerHTML = `
          <div class="game-card-cover">
            ${coverHtml}
            ${statusHtml}
          </div>
          <div class="game-card-body">
            <div class="game-card-title">${g.name}</div>
            <div class="game-card-engine">${g.engine_name || '通用引擎'}</div>
            <div class="game-card-actions">
              <span style="font-size:12px; color:var(--text-muted);">${g.source === 'steam' ? 'Steam 游戏' : '本地目录'}</span>
              <button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); selectGameAndAdvance(${JSON.stringify(g).replace(/"/g, '&quot;')})">选择并下一步 →</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterGames() {
      const kw = document.getElementById('game-search-input').value.toLowerCase().trim();
      const filtered = allGames.filter(g => g.name.toLowerCase().includes(kw) || (g.engine_name && g.engine_name.toLowerCase().includes(kw)));
      renderGameCards(filtered);
    }

    function selectGameAndAdvance(game) {
      currentGame = game;
      // If already running, skip Gatekeeper straight to Stage 3!
      if (game.is_running) {
        goToStage(3);
      } else {
        goToStage(2);
      }
    }

    // --- Stage 2: Gatekeeper Launch & Link ---
    function setupGatekeeper(game) {
      document.getElementById('stage-gatekeeper').classList.add('active');

      document.getElementById('gatekeeper-game-title').textContent = game.name;
      document.getElementById('gatekeeper-game-meta').textContent = `引擎: ${game.engine_name || '已识别'} · 适配器就绪`;

      const coverImg = document.getElementById('gatekeeper-cover-img');
      if (game.cover_url) {
        coverImg.src = game.cover_url;
        coverImg.style.display = 'block';
      } else {
        coverImg.style.display = 'none';
      }

      startProcessPolling(game);
    }

    async function checkProcessStatus(silent = false) {
      if (!currentGame) return false;
      try {
        const resp = await fetch('/api/process', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ game_dir: currentGame.game_dir })
        });
        const res = await resp.json();
        if (res.success && res.data.is_running) {
          const procs = res.data.running_processes || res.data.processes || [];
          const pid = procs[0]?.pid || 'Active';
          const name = procs[0]?.name || currentGame.name;
          currentGame.is_running = true;
          currentGame.running_pid = pid;

          const statusText = document.getElementById('gatekeeper-status-text');
          if (statusText) {
            statusText.textContent = `🟢 游戏进程已就绪: ${name} (PID: ${pid})，正在接入 AI 工作台...`;
            statusText.style.color = 'var(--emerald)';
          }
          const pulseDot = document.getElementById('gatekeeper-pulse');
          if (pulseDot) {
            pulseDot.style.background = 'var(--emerald)';
          }

          if (processPollTimer) {
            clearInterval(processPollTimer);
            processPollTimer = null;
          }

          if (!silent) {
            showToast(`🟢 游戏进程已连接 (${name} PID: ${pid})！自动进入 AI 创作工作台`, 'success');
          }
          setTimeout(() => {
            if (currentStage === 2) goToStage(3);
          }, 400);
          return true;
        }
      } catch (e) {
        console.warn('Process check error:', e);
      }
      return false;
    }

    async function launchAndAdvance() {
      if (!currentGame) return;
      showToast('正在启动游戏并自动创建存档快照...', 'info');
      try {
        const resp = await fetch('/api/games/launch', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            game_dir: currentGame.game_dir,
            appid: currentGame.appid || ''
          })
        });
        const res = await resp.json();
        if (res.success) {
          showToast(res.message || '启动指令已发送！正在等待游戏进程连接...', 'success');
          const statusText = document.getElementById('gatekeeper-status-text');
          if (statusText) statusText.textContent = '游戏已启动，正在探测连接主程序进程...';
          setTimeout(() => checkProcessStatus(true), 600);
          setTimeout(() => checkProcessStatus(true), 1600);
        } else {
          showToast('启动出错: ' + res.error, 'error');
        }
      } catch (e) {
        showToast('网络异常: ' + e.message, 'error');
      }
    }

    function startProcessPolling(game) {
      if (processPollTimer) clearInterval(processPollTimer);
      // Immediate probe
      checkProcessStatus(true);
      // Polling interval
      processPollTimer = setInterval(() => {
        if (!currentGame || currentStage !== 2) {
          if (processPollTimer) clearInterval(processPollTimer);
          return;
        }
        checkProcessStatus(true);
      }, 1500);
    }

    async function manualProcessRefresh() {
      if (!currentGame) return;
      showToast('正在探测游戏进程...', 'info');
      const isRunning = await checkProcessStatus(false);
      if (!isRunning) {
        showToast('未检测到该游戏的运行进程，请点击绿色按钮启动游戏，或确认游戏已打开。', 'info');
      }
    }

    function skipLaunchToStudio() {
      goToStage(3);
    }

    // --- Stage 3 & 4: AI Mod Studio ---
    function setupStudio(game) {
      document.getElementById('stage-studio').classList.add('active');

      document.getElementById('studio-game-title').textContent = game.name;
      const pill = document.getElementById('studio-running-pill');
      if (game.is_running) {
        pill.innerHTML = `<span class="pulse-dot"></span><span>已连接 PID: ${game.running_pid || 'Active'}</span>`;
        pill.style.background = 'var(--emerald-bg)';
        pill.style.color = 'var(--emerald)';
      } else {
        pill.innerHTML = `<span>○ 离线编写模式</span>`;
        pill.style.background = 'rgba(255, 255, 255, 0.05)';
        pill.style.color = 'var(--text-muted)';
      }

      if (chatHistory.length === 0) {
        initChatForGame(game);
      }
      loadGameMods(game);
      loadGameSaves(game);
    }

    function initChatForGame(game) {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      chatHistory = [];

      appendAIMessage(
        `你好！我已经接入 **${game.name}**（${game.engine_name || '检测就绪'}）。\n\n` +
        `你想在游戏里实现什么新特性？可以直接用自然语言告诉我，例如：\n` +
        `- **“角色移动速度提升一倍”**\n` +
        `- **“解锁空中二段跳”**\n` +
        `- **“敌人掉落金币提高 5 倍”**\n` +
        `- **“受到攻击减免 100% 伤害”**\n\n` +
        `我会直接在后台分析游戏逻辑并完成注入，游戏内立刻生效！`
      );
    }

    function appendUserMessage(text) {
      const container = document.getElementById('chat-messages');
      const msg = document.createElement('div');
      msg.className = 'msg msg-user';
      msg.innerHTML = `
        <div class="msg-avatar">你</div>
        <div class="msg-content">${text.replace(/</g, '&lt;')}</div>
      `;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      chatHistory.push({ role: 'user', content: text });
    }

    function appendAIMessage(markdownText, action = null, reaInsight = null) {
      const container = document.getElementById('chat-messages');
      const msg = document.createElement('div');
      msg.className = 'msg';

      let html = markdownText
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code style="background:var(--code-bg); color:var(--code-text); padding:2px 5px; border-radius:4px; font-family:var(--mono); font-size:12px;">$1</code>')
        .replace(/\n/g, '<br>');

      let reaHtml = '';
      if (reaInsight) {
        const syms = reaInsight.matched_symbols ? reaInsight.matched_symbols.slice(0, 3).map(s => `<code style="font-family:var(--mono); background:rgba(99,102,241,0.1); color:var(--primary); padding:1px 4px; border-radius:3px;">${s}</code>`).join(' ') : '';
        const guardsText = (reaInsight.exception_guards || []).join(' · ');
        const boundaryText = reaInsight.boundary_scope?.boundary_warning || '已完成数值范围与物理碰撞安全约束';
        const binName = reaInsight.target_binary || 'Game Target';

        reaHtml = `
          <div class="rea-card">
            <div class="rea-card-header">
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="rea-badge">🔬 REA 逆向工程分析</span>
                <span style="font-size:11px; color:var(--text-muted);">目标模块: <code style="font-family:var(--mono); color:var(--text-main); font-size:11px;">${binName}</code></span>
              </div>
              <span style="font-size:11px; color:var(--emerald); background:var(--emerald-bg); padding:1px 6px; border-radius:4px; font-weight:600;">置信度 ${Math.round((reaInsight.confidence || 0.35) * 100)}%</span>
            </div>
            <div class="rea-card-body">
              <div class="rea-item">
                <span class="rea-label">🎯 逆向定位符号:</span>
                <span class="rea-val">${syms || '动态符号解析就绪'}</span>
              </div>
              <div class="rea-item">
                <span class="rea-label">🛡️ 安全边界校验:</span>
                <span class="rea-val" style="color:var(--emerald);">${boundaryText}</span>
              </div>
              <div class="rea-item">
                <span class="rea-label">⚡ 异常防范守卫:</span>
                <span class="rea-val" style="color:var(--text-muted);">${guardsText || '异常沙箱隔离'}</span>
              </div>
            </div>
          </div>
        `;
      }

      let actionHtml = '';
      if (action) {
        activeActions.push(action);
        renderSidebarContent();

        let tuningHtml = '';
        if (action.tuning_params && action.tuning_params.length > 0) {
          tuningHtml = action.tuning_params.map(p => `
            <div class="tuning-item">
              <span>${p.label}: <strong id="val-${p.id}">${p.value}</strong></span>
              <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.value}" oninput="document.getElementById('val-${p.id}').textContent = this.value; onParamTune('${action.mod_id}', '${p.id}', this.value)">
            </div>
          `).join('');
        }

        actionHtml = `
          <div class="action-card">
            <div class="action-card-header">
              <span>✨ ${action.mod_name}</span>
              <span style="font-size:11px; background:var(--emerald-bg); color:var(--emerald); padding:2px 7px; border-radius:4px;">🟢 实时生效中</span>
            </div>
            <div style="font-size:12px; color:var(--text-muted);">${action.summary}</div>
            ${tuningHtml ? `<div class="tuning-group">${tuningHtml}</div>` : ''}
            <div class="action-card-footer">
              <span style="font-size:11px; color:var(--text-dim);">手感满意？</span>
              <div style="display:flex; gap:8px;">
                <button class="btn btn-sm btn-primary" onclick="pinMod('${action.mod_id}', '${action.mod_name}', '${action.summary}', '${action.hook_target || ''}')">📌 固化为永久 Mod</button>
                <button class="btn btn-sm" onclick="showToast('已撤回此项热修改', 'info')">↩️ 撤销</button>
              </div>
            </div>
          </div>
        `;
      }

      msg.innerHTML = `
        <div class="msg-avatar">AI</div>
        <div class="msg-content">
          ${html}
          ${reaHtml}
          ${actionHtml}
        </div>
      `;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      chatHistory.push({ role: 'assistant', content: markdownText });
    }

    function handleChatKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitPrompt();
      }
    }

    function sendPrompt(text) {
      document.getElementById('prompt-input').value = text;
      submitPrompt();
    }

    async function submitPrompt() {
      if (!currentGame) {
        showToast('请先选择游戏', 'error');
        return;
      }
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      appendUserMessage(text);

      const btn = document.getElementById('btn-send');
      btn.disabled = true;
      btn.textContent = '分析注入中...';

      try {
        const resp = await fetch('/api/mod/interact', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            game_dir: currentGame.game_dir,
            prompt: text,
            history: chatHistory
          })
        });
        const res = await resp.json();
        if (res.success) {
          appendAIMessage(res.data.reply, res.data.action, res.data.rea_insight);
        } else {
          appendAIMessage('❌ 生成失败: ' + res.error);
        }
      } catch (e) {
        appendAIMessage('❌ 网络连接错误: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '发送生成';
      }
    }

    function onParamTune(modId, paramId, val) {
      showToast(`已实时调节 [${paramId}] = ${val}`, 'info');
    }

    async function pinMod(modId, modName, summary, hookTarget = '') {
      if (!currentGame) return;
      showToast(`正在将【${modName}】固化为永久 Mod...`, 'info');
      try {
        const resp = await fetch('/api/mod/pin', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            game_dir: currentGame.game_dir,
            mod_id: modId,
            mod_name: modName,
            summary: summary,
            hook_target: hookTarget
          })
        });
        const res = await resp.json();
        if (res.success) {
          showToast(`🎉 ${res.data.message}`, 'success');
          loadGameMods(currentGame);
          goToStage(4);
          switchSidebarTab('mods');
        } else {
          showToast('固化失败: ' + res.error, 'error');
        }
      } catch (e) {
        showToast('固化请求失败: ' + e.message, 'error');
      }
    }

    // --- Sidebar Tabs & Data ---
    function switchSidebarTab(tab) {
      currentSidebarTab = tab;
      document.querySelectorAll('.sidebar-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      renderSidebarContent();
    }

    function renderSidebarContent() {
      const container = document.getElementById('sidebar-content');
      document.getElementById('active-mods-count').textContent = activeActions.length;
      document.getElementById('installed-mods-count').textContent = installedMods.length;

      if (currentSidebarTab === 'live') {
        if (activeActions.length === 0) {
          container.innerHTML = `
            <div style="text-align:center; padding:40px 10px; color:var(--text-muted);">
              <p>暂无正在生效的运行时修改</p>
              <p style="font-size:12px; margin-top:6px;">在左侧对话框对 AI 提出需求即可实时生效。</p>
            </div>
          `;
          return;
        }
        container.innerHTML = activeActions.map((act, idx) => `
          <div class="mod-item-card">
            <div class="mod-item-header">
              <span>${act.mod_name}</span>
              <span style="font-size:11px; color:var(--emerald);">● 生效中</span>
            </div>
            <div style="font-size:12px; color:var(--text-muted);">${act.summary}</div>
            <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:6px;">
              <button class="btn btn-sm btn-primary" onclick="pinMod('${act.mod_id}', '${act.mod_name}', '${act.summary}')">📌 固化为 Mod</button>
            </div>
          </div>
        `).join('');
      } else if (currentSidebarTab === 'mods') {
        if (installedMods.length === 0) {
          container.innerHTML = `
            <div style="text-align:center; padding:40px 10px; color:var(--text-muted);">
              <p>游戏目录暂无已安装的 Mod</p>
            </div>
          `;
          return;
        }
        container.innerHTML = installedMods.map(m => `
          <div class="mod-item-card">
            <div class="mod-item-header">
              <span>${m.name || m.id}</span>
              <span style="font-size:11px; color:var(--primary);">已安装</span>
            </div>
            <div style="font-size:12px; color:var(--text-muted);">${m.description || m.path || ''}</div>
            <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:6px;">
              <button class="btn btn-sm" onclick="uninstallMod('${m.id}')" style="color:var(--rose);">卸载</button>
            </div>
          </div>
        `).join('');
      } else if (currentSidebarTab === 'saves') {
        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="font-size:13px; font-weight:700;">存档安全快照</span>
            <button class="btn btn-sm btn-primary" onclick="createSaveBackup()">+ 新建备份</button>
          </div>
          <div id="saves-list-container">
            <div style="text-align:center; padding:30px 10px; color:var(--text-muted);">加载存档快照中...</div>
          </div>
        `;
        loadGameSaves(currentGame);
      }
    }

    async function loadGameMods(game) {
      if (!game) return;
      try {
        const resp = await fetch('/api/mods/list', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ game_dir: game.game_dir })
        });
        const res = await resp.json();
        if (res.success) {
          installedMods = res.data.mods || [];
          document.getElementById('installed-mods-count').textContent = installedMods.length;
          if (currentSidebarTab === 'mods') renderSidebarContent();
        }
      } catch (e) {}
    }

    async function uninstallMod(modId) {
      if (!currentGame) return;
      try {
        const resp = await fetch('/api/mods/uninstall', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ game_dir: currentGame.game_dir, mod_id: modId })
        });
        const res = await resp.json();
        if (res.success) {
          showToast('Mod 已安全卸载！', 'success');
          loadGameMods(currentGame);
        }
      } catch (e) {
        showToast('卸载失败: ' + e.message, 'error');
      }
    }

    async function loadGameSaves(game) {
      if (!game) return;
      try {
        const resp = await fetch('/api/saves/list', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ game_dir: game.game_dir })
        });
        const res = await resp.json();
        if (res.success) {
          const listDiv = document.getElementById('saves-list-container');
          if (!listDiv) return;
          const backups = res.data.backups || [];
          if (backups.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">暂无备份记录</div>';
            return;
          }
          listDiv.innerHTML = backups.map(b => `
            <div class="mod-item-card" style="margin-bottom:8px;">
              <div class="mod-item-header">
                <span>🛡️ ${b.backup_id}</span>
              </div>
              <div style="font-size:11px; color:var(--text-muted);">${b.created_at || ''} (${b.file_count || 0} 个文件)</div>
              <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:6px;">
                <button class="btn btn-sm" onclick="restoreSave('${b.backup_id}')">还原此备份</button>
              </div>
            </div>
          `).join('');
        }
      } catch (e) {}
    }

    async function restoreSave(backupId) {
      if (!confirm(`确定要将游戏存档还原到快照 [${backupId}] 吗？`)) return;
      try {
        const resp = await fetch('/api/saves/restore', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ game_dir: currentGame.game_dir, backup_id: backupId })
        });
        const res = await resp.json();
        if (res.success) {
          showToast('存档已成功还原！', 'success');
        } else {
          showToast('还原失败: ' + res.error, 'error');
        }
      } catch (e) {
        showToast('还原请求出错: ' + e.message, 'error');
      }
    }

    async function createSaveBackup() {
      if (!currentGame) return;
      showToast('正在创建游戏存档安全快照...', 'info');
      try {
        const resp = await fetch('/api/saves/create', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ game_dir: currentGame.game_dir, reason: 'Manual_Backup' })
        });
        const res = await resp.json();
        if (res.success) {
          showToast('🛡️ 存档安全快照已创建！', 'success');
          loadGameSaves(currentGame);
        }
      } catch (e) {
        showToast('备份失败: ' + e.message, 'error');
      }
    }

    async function launchCurrentGame() {
      if (!currentGame) return;
      launchAndAdvance();
    }

    function addCustomGame() {
      const p = prompt('请输入你的游戏根目录完整路径 (例如: D:\\Games\\MyGame):');
      if (!p || !p.trim()) return;
      selectGameAndAdvance({
        id: 'custom_' + Date.now(),
        name: p.split(/[\\/]/).filter(Boolean).pop() || '自定义游戏',
        game_dir: p.trim(),
        appid: '',
        engine_name: '待检测',
        is_running: false
      });
    }

    // --- LLM & CC Switch Modal ---
    function openLLMModal() {
      document.getElementById('llm-modal').classList.add('active');
    }
    function closeLLMModal() {
      document.getElementById('llm-modal').classList.remove('active');
    }

    let llmPresets = {};
    async function loadLLMConfig() {
      try {
        const resp = await fetch('/api/llm/config');
        const res = await resp.json();
        if (res.success) {
          const cfg = res.data.config || {};
          llmPresets = res.data.presets || {};
          document.getElementById('llm-endpoint').value = cfg.api_endpoint || 'http://127.0.0.1:8000/v1';
          document.getElementById('llm-model').value = cfg.model_name || 'claude-3-7-sonnet';
          if (cfg.api_key_preview) {
            document.getElementById('llm-key').placeholder = `已配置密钥: ${cfg.api_key_preview}`;
          }
        }
      } catch (e) {}
    }

    function onPresetChange() {
      const key = document.getElementById('llm-preset-select').value;
      const preset = llmPresets[key];
      if (preset) {
        document.getElementById('llm-endpoint').value = preset.api_endpoint || '';
        document.getElementById('llm-model').value = preset.model_name || '';
      }
    }

    async function testLLMConnection() {
      showToast('正在测试与大模型接口的连接...', 'info');
      try {
        const resp = await fetch('/api/llm/test', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            api_endpoint: document.getElementById('llm-endpoint').value.trim(),
            api_key: document.getElementById('llm-key').value.trim(),
            model_name: document.getElementById('llm-model').value.trim()
          })
        });
        const res = await resp.json();
        if (res.success) {
          showToast(`⚡ ${res.message}`, 'success');
        } else {
          showToast(`❌ 测试失败: ${res.error}`, 'error');
        }
      } catch (e) {
        showToast('测试网络异常: ' + e.message, 'error');
      }
    }

    async function saveLLMConfig() {
      try {
        const body = {
          api_endpoint: document.getElementById('llm-endpoint').value.trim(),
          model_name: document.getElementById('llm-model').value.trim()
        };
        const key = document.getElementById('llm-key').value.trim();
        if (key) body.api_key = key;

        const resp = await fetch('/api/llm/config', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });
        const res = await resp.json();
        if (res.success) {
          showToast('大模型配置保存成功！', 'success');
          closeLLMModal();
        } else {
          showToast('保存失败: ' + res.error, 'error');
        }
      } catch (e) {
        showToast('保存配置异常: ' + e.message, 'error');
      }
    }
  </script>
</body>
</html>
