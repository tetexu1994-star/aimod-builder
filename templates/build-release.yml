# GitHub Actions: build a BepInEx plugin and publish it as a release.
# Put this in the mod's repo as .github/workflows/build-release.yml.
#
# It builds on push to main and on tags v* (tags create a release).
# The agent's `check_update` / `update_mod` then poll this release.

name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Download the BepInEx refs so the csproj's <Reference> can resolve.
      - name: Fetch BepInEx refs
        shell: pwsh
        run: |
          $v = "5.4.23.0"
          Invoke-WebRequest "https://github.com/BepInEx/BepInEx/releases/download/v$v/BepInEx_win_x64_$v.zip" -OutFile bep.zip
          Expand-Archive bep.zip -DestinationPath bep
          New-Item -ItemType Directory -Force lib | Out-Null
          Copy-Item "bep/BepInEx/core/BepInEx.dll" lib/
          Copy-Item "bep/BepInEx/core/0Harmony.dll" lib/

      - name: Build
        run: dotnet build -c Release

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net472/*.dll
