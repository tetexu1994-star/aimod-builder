[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "game-mod-agent"
version = "0.1.0"
description = "An MCP tool server that lets an AI agent understand and modify PC games."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
game-mod-agent = "server:main"

[tool.setuptools.packages.find]
include = ["agmod*"]
